name: BingX Order Block Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: bingx-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run one bot cycle
        env:
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          TIMEFRAME: ${{ vars.TIMEFRAME }}
          RISK_PCT_PER_TRADE: ${{ vars.RISK_PCT_PER_TRADE }}
          LEVERAGE: ${{ vars.LEVERAGE }}
          MAX_MARGIN_UTILIZATION_PCT: ${{ vars.MAX_MARGIN_UTILIZATION_PCT }}
          MAX_DAILY_LOSS_PCT: ${{ vars.MAX_DAILY_LOSS_PCT }}
          MAX_CONCURRENT_POSITIONS: ${{ vars.MAX_CONCURRENT_POSITIONS }}
          REWARD_RISK_RATIO: ${{ vars.REWARD_RISK_RATIO }}
          TREND_FILTER_ENABLED: ${{ vars.TREND_FILTER_ENABLED }}
          HTF_TIMEFRAMES: ${{ vars.HTF_TIMEFRAMES }}
          HTF_PRIMARY_TIMEFRAMES: ${{ vars.HTF_PRIMARY_TIMEFRAMES }}
          TREND_EMA_PERIOD: ${{ vars.TREND_EMA_PERIOD }}
          TREND_CANDLE_LIMIT: ${{ vars.TREND_CANDLE_LIMIT }}
          PARTIAL_TP_R_MULTIPLE: ${{ vars.PARTIAL_TP_R_MULTIPLE }}
          PARTIAL_TP_FRACTION: ${{ vars.PARTIAL_TP_FRACTION }}
          TRAIL_R_MULTIPLE: ${{ vars.TRAIL_R_MULTIPLE }}
          DRY_RUN_FEE_PCT_PER_SIDE: ${{ vars.DRY_RUN_FEE_PCT_PER_SIDE }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python3 bot.py

      - name: Persist bot state and trade journal back to the repo
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/ 2>/dev/null)" ]; then
            git config user.name "bingx-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/state.json data/trades.csv 2>/dev/null || true
            git commit -m "chore: update bot state and trade journal"
            git push
          else
            echo "No state/journal changes to commit."
          fi
